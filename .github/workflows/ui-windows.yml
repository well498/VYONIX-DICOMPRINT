# Interface do VYONIX DICOM Print no Windows com o Qt real (Prompt Mestre §14 e §46):
# contraste dos temas, matriz de resolução/escala/monitores e testes de fumaça da interface.
# Execução rápida e separada do pipeline de release; o pipeline completo também roda estes testes.
name: UI Windows

on:
  push:
    branches: [develop, "build/**", "phase/**"]
    paths:
      - "app/**"
      - "tests/test_ui_*.py"
      - "tests/ui_matrix_probe.py"
      - "tools/ui_matrix_summary.py"
      - ".github/workflows/ui-windows.yml"
  workflow_dispatch:

concurrency:
  group: ui-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Instalar dependências
        run: |
          python -m pip install -q --upgrade pip setuptools wheel
          python -m pip install -q -r requirements-dev.txt
          python -c "import PySide6, PySide6.QtCore as c; print('PySide6', PySide6.__version__, 'Qt', c.qVersion())"
      - name: Testes de interface
        env:
          QT_QPA_PLATFORM: offscreen
          VYONIX_UI_MATRIX_OUT: ${{ github.workspace }}\dist\ui_matrix
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python -m pytest tests/test_ui_tokens.py tests/test_ui_operation.py tests/test_ui_matrix.py tests/test_ui_smoke.py -v -ra -o faulthandler_timeout=600 --junitxml=dist\ui.xml 2>&1 | Tee-Object dist\ui.txt
          $code = $LASTEXITCODE
          python tools\junit_annotations.py dist\ui.xml
          python tools\ui_matrix_summary.py dist\ui_matrix
          $tail = (Get-Content dist\ui.txt -Tail 30) -join "%0A"
          Write-Output "::notice title=pytest (final)::$tail"
          exit $code
