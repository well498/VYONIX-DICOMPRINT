# Interface do VYONIX DICOM Print no Windows com o Qt real (Prompt Mestre §14 e §46):
# contraste dos temas, matriz de resolução/escala/monitores e testes de fumaça da interface.
# Execução rápida e separada do pipeline de release; o pipeline completo também roda estes testes.
name: UI Windows

on:
  push:
    branches: [develop, "build/**", "phase/**"]
    paths:
      - "app/**"
      - "tests/test_ui_*.py"
      - "tests/ui_matrix_probe.py"
      - "tools/ui_matrix_summary.py"
      - ".github/workflows/ui-windows.yml"
  workflow_dispatch:

concurrency:
  group: ui-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Instalar dependências
        run: |
          python -m pip install -q --upgrade pip setuptools wheel
          python -m pip install -q -r requirements-dev.txt "pytest-timeout>=2.3,<3"
          python -c "import PySide6, PySide6.QtCore as c; print('PySide6', PySide6.__version__, 'Qt', c.qVersion())"
      - name: Testes de interface
        env:
          QT_QPA_PLATFORM: offscreen
          VYONIX_UI_MATRIX_OUT: ${{ github.workspace }}\dist\ui_matrix
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $code = 0
          # cada arquivo separado e com limite por teste: um travamento não esconde os demais resultados
          foreach ($t in "test_ui_tokens", "test_ui_operation", "test_ui_smoke", "test_ui_matrix") {
            python -m pytest "tests/$t.py" -v -ra --timeout=420 --timeout-method=thread --junitxml="dist\$t.xml" 2>&1 | Tee-Object "dist\$t.txt"
            if ($LASTEXITCODE -ne 0) { $code = 1 }
            if ($t -ne "test_ui_matrix") { python tools\junit_annotations.py "dist\$t.xml" }
            $tail = ((Get-Content "dist\$t.txt" -Tail 40) -join "%0A").Replace("::", ": :")
            Write-Output "::notice title=$t::$tail"
          }
          python tools\ui_matrix_summary.py dist\ui_matrix
          exit $code
