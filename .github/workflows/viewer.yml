name: viewer

# VYONIX VIEWER: compila o OHIF 3.13 (MIT, sem alterações no código) com viewer/vyonix.js e abre um
# estudo sintético no Chromium contra o CORE real (HTTPS), PostgreSQL real e Orthanc real.
# Falha se algum teste for pulado. Não é validação clínica do Viewer.
on:
  push:
    branches: [develop, main]
    paths: ["viewer/**", "vyonix/pacs/**", "vyonix/api/**", "tests_viewer/**", ".github/workflows/viewer.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: true

env:
  OHIF_TAG: v3.13.13

jobs:
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      VYONIX_TEST_ADMIN_URL: postgresql://postgres:ci-postgres@127.0.0.1:5432/postgres
      VYONIX_TEST_ORTHANC_URL: http://127.0.0.1:8042
      VYONIX_TEST_ORTHANC_USER: vyonix
      VYONIX_TEST_ORTHANC_PASSWORD: ci-orthanc-only
      VYONIX_E2E_SHOTS: ${{ github.workspace }}/viewer-shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: OHIF ${{ env.OHIF_TAG }} (código-fonte oficial)
        run: |
          git clone --depth 1 --branch "$OHIF_TAG" https://github.com/OHIF/Viewers.git "$RUNNER_TEMP/ohif"
          cd "$RUNNER_TEMP/ohif"
          echo "::notice title=OHIF::$(git rev-parse HEAD) ($OHIF_TAG); licença: $(head -1 LICENSE)"
          cp "$GITHUB_WORKSPACE/viewer/vyonix.js" platform/app/public/config/vyonix.js
          corepack enable
          pnpm install --frozen-lockfile
      - name: Compilar o Viewer
        working-directory: ${{ runner.temp }}/ohif
        env:
          NODE_ENV: production
          APP_CONFIG: config/vyonix.js
          PUBLIC_URL: /viewer/
          QUICK_BUILD: "false"
        run: |
          cd platform/app
          npx cross-env NODE_OPTIONS=--max-old-space-size=12288 rspack build --config .webpack/webpack.pwa.js
          mkdir -p "$GITHUB_WORKSPACE/viewer/dist"
          cp -r dist/. "$GITHUB_WORKSPACE/viewer/dist/"
          echo "::notice title=Viewer::$(du -sh "$GITHUB_WORKSPACE/viewer/dist" | cut -f1), $(find "$GITHUB_WORKSPACE/viewer/dist" -type f | wc -l) arquivos"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-security.txt -r requirements-platform-dev.txt pillow
          python -m playwright install --with-deps chromium
      - name: Orthanc (pacote da distribuição, só o núcleo, sem plugins)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq orthanc
          sudo systemctl stop orthanc || true
          mkdir -p "$RUNNER_TEMP/orthanc"
          cat > "$RUNNER_TEMP/orthanc/ci.json" <<JSON
          {"Name": "VYONIX-CI", "StorageDirectory": "$RUNNER_TEMP/orthanc/db", "IndexDirectory": "$RUNNER_TEMP/orthanc/db",
           "HttpPort": 8042, "DicomPort": 4242, "DicomAet": "VYONIXCI", "RemoteAccessAllowed": false,
           "AuthenticationEnabled": true, "RegisteredUsers": {"vyonix": "ci-orthanc-only"}, "Plugins": []}
          JSON
          ORTHANC_BIN=$(command -v Orthanc || ls /usr/sbin/Orthanc)
          echo "::notice title=Orthanc binário::$ORTHANC_BIN $(dpkg-query -W -f='${Version}' orthanc)"
          nohup "$ORTHANC_BIN" "$RUNNER_TEMP/orthanc/ci.json" > "$RUNNER_TEMP/orthanc/log.txt" 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -u vyonix:ci-orthanc-only http://127.0.0.1:8042/system > "$RUNNER_TEMP/orthanc/system.json"; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "::error title=Orthanc não respondeu::$(tail -c 1500 "$RUNNER_TEMP/orthanc/log.txt" | tr '\n' ' ')"
            exit 1
          fi
          curl -sf -u vyonix:ci-orthanc-only http://127.0.0.1:8042/plugins > "$RUNNER_TEMP/orthanc/plugins.json"
          python3 - "$RUNNER_TEMP/orthanc" <<'PY'
          import json, sys, pathlib
          d = pathlib.Path(sys.argv[1])
          sysinfo, plugins = json.loads((d / "system.json").read_text()), json.loads((d / "plugins.json").read_text())
          print(f"::notice title=Orthanc::versão {sysinfo.get('Version')}, API {sysinfo.get('ApiVersion')}, plugins {plugins}")
          extra = [p for p in plugins if p != "explorer.js"]   # explorer.js = extensão embutida da Orthanc Explorer, não é plugin
          assert extra == [], f"plugins carregados: {extra}"
          PY
      - name: Viewer de ponta a ponta (Chromium)
        run: python -m pytest tests_viewer tests_platform/test_viewer_serving.py -ra -v --junitxml=viewer-junit.xml
      - name: Garantia de execução (nenhum teste pulado)
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse("viewer-junit.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          fails = int(s.get("failures")) + int(s.get("errors"))
          print(f"::notice title=Viewer::testes={tests} pulados={skipped} falhas={fails}")
          assert tests > 0 and skipped == 0 and fails == 0, "testes pulados ou com falha"
          PY
      - name: Falhas de teste como anotações
        if: failure()
        run: python tools/junit_annotations.py viewer-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vyonix-viewer-e2e
          path: |
            viewer-junit.xml
            viewer-shots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: vyonix-viewer-dist
          path: viewer/dist/
          retention-days: 30
