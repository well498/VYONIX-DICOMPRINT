name: deploy-windows

# Fase 2 — VYONIX DEPLOY no Windows: testes do motor, empacotamento (PyInstaller + PostgreSQL 17 +
# Inno Setup) e aceitação real no runner (instala, confere, repete, quebra e repara, atualiza, ativa
# módulo, testa rede em adaptador de loopback e desinstala). Independente do pipeline do DICOM Print.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      flavor:
        description: "commercial (padrão) ou homologacao (instalador interno de testes, módulos sem licença)"
        required: false
        default: commercial
        type: choice
        options: [commercial, homologacao]

permissions:
  contents: read
  actions: read          # baixar o instalador de homologação anterior (atualização por cima da versão do proprietário)

concurrency:
  group: deploy-windows-${{ github.ref }}-${{ inputs.flavor || 'commercial' }}
  cancel-in-progress: true

env:
  OHIF_TAG: v3.13.13
  PG_VERSION: "17.11"
  ORTHANC_VERSION: "1.13.0"
  ORTHANC_SHA256: "2D507DF95DCABB479D3931992F5A2607CDE105DBE38B4562F43653E7CE10C424"   # medido no 1º download (run 40059704391)
  PG_URLS: "https://get.enterprisedb.com/postgresql/postgresql-17.11-1-windows-x64-binaries.zip https://sbp.enterprisedb.com/getfile.jsp?fileid=1260616"

jobs:
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compilar o Viewer (OHIF ${{ env.OHIF_TAG }})
        run: tools/build_viewer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-dist-deploy
          path: viewer/dist/
          retention-days: 3

  deploy:
    needs: viewer
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-security.txt -r requirements-platform.txt pyinstaller==6.16.0 pypdf pytest
          # Pacotes já presentes na imagem do runner (ex.: filelock do pipx) não passam pela restrição acima:
          python -m pip install -q --upgrade -r constraints-security.txt

      - name: SBOM e vulnerabilidades conhecidas
        run: |
          python -m venv "$env:RUNNER_TEMP\sbomtools"
          & "$env:RUNNER_TEMP\sbomtools\Scripts\python" -m pip install -q "cyclonedx-bom>=4,<8" "pip-audit>=2.7,<3"
          $py = (Get-Command python).Source
          & "$env:RUNNER_TEMP\sbomtools\Scripts\python" tools\sbom_audit.py $py dist\sbom vyonix-platform
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Testes do motor do DEPLOY (Windows)
        env:
          VYONIX_REQUIRE_PYPDF: "1"
        run: python -m pytest tests_deploy -ra -q --junitxml=dist/deploy-junit.xml

      - name: Interface web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Variante de homologação interna (só nesta compilação)
        if: ${{ inputs.flavor == 'homologacao' }}
        shell: pwsh
        run: |
          Set-Content -Encoding utf8 vyonix\build_flavor.py "FLAVOR = `"homologacao`"`nHOMOLOG = True`n"
          Write-Host "::warning title=Homologação interna::instalador sem licença comercial, só para testes com dados fictícios"

      - name: PyInstaller (dist\VyonixPlatform)
        run: python -m PyInstaller --noconfirm --clean VyonixPlatform.spec

      - name: PostgreSQL ${{ env.PG_VERSION }} (binários oficiais EDB)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\pgsql.zip"; $ok = $false
          foreach ($u in $env:PG_URLS.Split(' ')) {
            try { Invoke-WebRequest $u -OutFile $zip -UseBasicParsing -MaximumRedirection 5; $ok = (Get-Item $zip).Length -gt 100MB } catch { Write-Host "falhou: $u $_" }
            if ($ok) { Write-Host "baixado de $u"; break }
          }
          if (-not $ok) { throw "Não foi possível baixar os binários do PostgreSQL" }
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          Expand-Archive $zip "$env:RUNNER_TEMP\pg" -Force
          $dst = "dist\VyonixPlatform\pgsql"
          New-Item -ItemType Directory $dst -Force | Out-Null
          foreach ($d in 'bin','lib','share') { Copy-Item "$env:RUNNER_TEMP\pg\pgsql\$d" $dst -Recurse -Force }
          $v = & "$dst\bin\postgres.exe" --version
          if ($v -notmatch [regex]::Escape($env:PG_VERSION)) { throw "versão inesperada: $v" }
          "PostgreSQL: $v; zip SHA-256 $sha" | Tee-Object -FilePath "dist\VyonixPlatform\pgsql\ORIGEM.txt"
          Write-Host "::notice title=PostgreSQL embutido::$v (zip SHA-256 $sha)"

      - uses: actions/download-artifact@v4
        with:
          name: viewer-dist-deploy
          path: dist/VyonixPlatform/_internal/viewer
      - name: Viewer no pacote
        shell: pwsh
        run: |
          if (-not (Test-Path dist\VyonixPlatform\_internal\viewer\index.html)) { throw "Viewer ausente do pacote" }
          $n = (Get-ChildItem dist\VyonixPlatform\_internal\viewer -Recurse -File).Count
          Write-Host "::notice title=Viewer no pacote::$n arquivos; $(Get-Content dist\VyonixPlatform\_internal\viewer\ORIGEM.txt)"

      - name: Cache do Orthanc oficial (mesma versão e SHA-256)
        uses: actions/cache@v4
        with:
          path: .orthanc-cache
          key: orthanc-${{ env.ORTHANC_VERSION }}-${{ env.ORTHANC_SHA256 }}
      - name: Orthanc ${{ env.ORTHANC_VERSION }} (binário oficial, só o núcleo, sem plugins)
        shell: pwsh
        run: |
          # Executável oficial do projeto Orthanc (GPLv3, sem modificações, sem plugins — ADR-0012).
          # O site não publica SHA-256: o valor fixado em ORTHANC_SHA256 foi medido no primeiro download do CI.
          $url = "https://orthanc.uclouvain.be/downloads/windows-64/orthanc/$env:ORTHANC_VERSION/Orthanc.exe"
          $dst = "dist\VyonixPlatform\orthanc"
          New-Item -ItemType Directory $dst -Force | Out-Null
          $ok = $false
          # cache local do CI (chave = versão + SHA-256 fixado); o SHA-256 é conferido de novo abaixo
          $cached = ".orthanc-cache\Orthanc.exe"
          if ((Test-Path $cached) -and $env:ORTHANC_SHA256 -and ((Get-FileHash $cached -Algorithm SHA256).Hash -eq $env:ORTHANC_SHA256)) {
            Copy-Item $cached "$dst\Orthanc.exe"; $ok = $true
            Write-Host "::notice title=Orthanc::usado do cache do CI (SHA-256 conferido)"
          }
          for ($i = 1; $i -le 4 -and -not $ok; $i++) {
            try { Invoke-WebRequest $url -OutFile "$dst\Orthanc.exe" -UseBasicParsing -TimeoutSec 300; $ok = $true }
            catch { Write-Host "::warning title=Download do Orthanc (tentativa $i)::$($_.Exception.Message)"; Start-Sleep -Seconds (20 * $i) }
          }
          if (-not $ok) { Write-Host "::error title=Download do Orthanc::site indisponível após 4 tentativas ($url)"; exit 1 }
          New-Item -ItemType Directory .orthanc-cache -Force | Out-Null
          Copy-Item "$dst\Orthanc.exe" .orthanc-cache\Orthanc.exe -Force
          $sha = (Get-FileHash "$dst\Orthanc.exe" -Algorithm SHA256).Hash
          if ($env:ORTHANC_SHA256 -and $sha -ne $env:ORTHANC_SHA256) {
            # Nunca segue com um binário diferente do fixado: pode ser republicação ou adulteração. Conferir antes de trocar o valor.
            Write-Host "::error title=SHA-256 do Orthanc.exe diferente do fixado::obtido $sha; fixado $env:ORTHANC_SHA256"; exit 1
          }
          if (-not $env:ORTHANC_SHA256) { Write-Host "::warning title=Orthanc SHA-256 não fixado::$sha (fixar em ORTHANC_SHA256)" }
          $info = (Get-Item "$dst\Orthanc.exe").VersionInfo
          @"
          Orthanc $env:ORTHANC_VERSION — servidor DICOM do projeto Orthanc (https://orthanc.uclouvain.be), licença GPLv3.
          Executável oficial sem modificações, baixado de $url
          SHA-256: $sha
          Código-fonte correspondente: https://orthanc.uclouvain.be/hg/orthanc/ (etiqueta Orthanc-$env:ORTHANC_VERSION)
          e https://orthanc.uclouvain.be/downloads/sources/orthanc/
          Executado como processo separado pelo serviço VyonixPacsEngine, sem plugins.
          "@ | Out-File "$dst\LEIA-ME_ORTHANC.txt" -Encoding utf8
          # texto da GPLv3 versionado no repositório (o download do gnu.org falhava de forma intermitente no CI)
          Copy-Item packaging\licenses\GPL-3.0.txt "$dst\COPYING_GPLv3.txt"
          if ((Get-FileHash "$dst\COPYING_GPLv3.txt" -Algorithm SHA256).Hash -ne "3972DC9744F6499F0F9B2DBF76696F2AE7AD8AF9B23DDE66D6AF86C9DFB36986") {
            Write-Host "::error title=GPLv3::texto da licença diferente do oficial"; exit 1 }
          Write-Host "::notice title=Orthanc embutido::$env:ORTHANC_VERSION ($($info.FileVersion)) SHA-256 $sha"

      - name: Versão
        shell: pwsh
        run: |
          $v = python -c "import vyonix; print(vyonix.__version__)"
          Set-Content -NoNewline -Encoding ascii dist\VyonixPlatform\VERSION.txt $v
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Inno Setup (VYONIX_Setup_x64.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $extra = @(); $name = "VYONIX_Setup_x64.exe"
          if ("${{ inputs.flavor }}" -eq "homologacao") { $extra = @("/DHomolog=1"); $name = "VYONIX_Homologacao_Setup_x64.exe" }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DFileVersion=$env:APP_VERSION.0" @extra installer\VyonixPlatform.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }
          $f = Get-Item "dist\installer-platform\$name"
          Write-Host "::notice title=Instalador::$($f.Name) $([math]::Round($f.Length/1MB,1)) MB SHA-256 $((Get-FileHash $f -Algorithm SHA256).Hash)"

      - name: Nenhuma chave privada no pacote
        run: python tools/scan_private_keys.py dist/VyonixPlatform dist/installer-platform

      - name: Dependências vulneráveis no pacote distribuído
        run: python tools/bundle_vuln_check.py dist/sbom/vyonix-platform.vulnerable.json dist/VyonixPlatform

      - name: DICOM Print (release publicada, para o teste de coexistência)
        if: ${{ inputs.flavor != 'homologacao' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist\print -Force | Out-Null
          gh release download v1.0.0-r5 -R ${{ github.repository }} -p "VYONIX_DICOM_Print_Setup_*.exe" -D dist\print
          Get-ChildItem dist\print

      - name: Aceitação real no Windows
        if: ${{ inputs.flavor != 'homologacao' }}
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          $print = (Get-ChildItem dist\print\*.exe | Select-Object -First 1).FullName
          python tools/ci_deploy_acceptance.py --setup dist\installer-platform\VYONIX_Setup_x64.exe `
            --dist dist\VyonixPlatform --print-setup "$print" --out dist\acceptance 2>&1 | Tee-Object -FilePath dist\acceptance-console.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content dist\acceptance-console.txt -Tail 40) -join "%0A"
            Write-Host "::error title=Saída final da aceitação (código $code)::$tail"
            throw "critérios reprovados"
          }

      - name: Instalador de homologação anterior (bc9cf28, o que está no computador do proprietário)
        if: ${{ inputs.flavor == 'homologacao' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 40896631587 -R ${{ github.repository }} -n homologacao-windows -D dist\previous
          Get-ChildItem dist\previous -Recurse -Filter *.exe | ForEach-Object { Write-Host "::notice title=Versão anterior::$($_.FullName) SHA-256 $((Get-FileHash $_ -Algorithm SHA256).Hash)" }

      - name: Homologação interna — roteiro do proprietário executado no instalador
        if: ${{ inputs.flavor == 'homologacao' }}
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          $prev = (Get-ChildItem dist\previous -Recurse -Filter VYONIX_Homologacao_Setup_x64.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          $extra = @(); if ($prev) { $extra = @("--previous-setup", $prev) }
          python tools/ci_homolog_acceptance.py --setup dist\installer-platform\VYONIX_Homologacao_Setup_x64.exe --out dist\acceptance @extra 2>&1 | Tee-Object -FilePath dist\acceptance-console.txt
          if ($LASTEXITCODE -ne 0) { throw "roteiro de homologação reprovado" }

      - name: Diagnóstico em caso de falha
        if: failure()
        shell: pwsh
        run: |
          Get-Service Vyonix* -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
          foreach ($f in Get-ChildItem "$env:ProgramData\VYONIX\Platform\logs\*.log" -ErrorAction SilentlyContinue) { Write-Host "== $f"; Get-Content $f -Tail 80 }
          foreach ($f in Get-ChildItem "$env:ProgramData\VYONIX\PostgreSQL\17\data\log\*" -ErrorAction SilentlyContinue) { Write-Host "== $f"; Get-Content $f -Tail 60 }
          Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -match 'Vyonix|Python|PostgreSQL|Service Control' } | Format-List TimeCreated,ProviderName,Message | Out-String | Write-Host

      - name: Falhas de teste como anotações
        if: failure()
        run: python tools/junit_annotations.py dist/deploy-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.flavor == 'homologacao' && 'homologacao-windows' || 'deploy-windows' }}
          path: |
            dist/acceptance/
            dist/deploy-junit.xml
            dist/installer-platform/*.exe
            docs/homologacao/Roteiro_Homologacao_Interna_Plataforma.md
          if-no-files-found: ignore
          retention-days: 30
