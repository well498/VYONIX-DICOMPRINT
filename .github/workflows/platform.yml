name: platform

# VYONIX Platform (Core): testes com PostgreSQL 17 real, compilação da interface web e testes de
# ponta a ponta no Chromium. O pipeline do DICOM Print (windows-release.yml) não é alterado.
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      VYONIX_TEST_ADMIN_URL: postgresql://postgres:ci-postgres@127.0.0.1:5432/postgres
      VYONIX_E2E_SHOTS: ${{ github.workspace }}/e2e-shots
      VYONIX_REQUIRE_PYPDF: "1"
      VYONIX_TEST_ORTHANC_URL: http://127.0.0.1:8042
      VYONIX_TEST_ORTHANC_USER: vyonix
      VYONIX_TEST_ORTHANC_PASSWORD: ci-orthanc-only
      VYONIX_TEST_ORTHANC_DICOM: 127.0.0.1:4242:VYONIXCI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-security.txt -r requirements-platform-dev.txt
          python -m playwright install --with-deps chromium
      - name: Orthanc (pacote da distribuição, só o núcleo, sem plugins)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq orthanc
          sudo systemctl stop orthanc || true
          mkdir -p "$RUNNER_TEMP/orthanc"
          cat > "$RUNNER_TEMP/orthanc/ci.json" <<JSON
          {"Name": "VYONIX-CI", "StorageDirectory": "$RUNNER_TEMP/orthanc/db", "IndexDirectory": "$RUNNER_TEMP/orthanc/db",
           "HttpPort": 8042, "DicomPort": 4242, "DicomAet": "VYONIXCI", "RemoteAccessAllowed": false,
           "AuthenticationEnabled": true, "RegisteredUsers": {"vyonix": "ci-orthanc-only"}, "Plugins": [],
           "DicomAlwaysAllowStore": true, "DicomCheckCalledAet": false}
          JSON
          ORTHANC_BIN=$(command -v Orthanc || ls /usr/sbin/Orthanc)
          echo "::notice title=Orthanc binário::$ORTHANC_BIN $(dpkg-query -W -f='${Version}' orthanc)"
          nohup "$ORTHANC_BIN" "$RUNNER_TEMP/orthanc/ci.json" > "$RUNNER_TEMP/orthanc/log.txt" 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -u vyonix:ci-orthanc-only http://127.0.0.1:8042/system > "$RUNNER_TEMP/orthanc/system.json"; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "::error title=Orthanc não respondeu::$(tail -c 1500 "$RUNNER_TEMP/orthanc/log.txt" | tr '\n' ' ')"
            exit 1
          fi
          curl -sf -u vyonix:ci-orthanc-only http://127.0.0.1:8042/plugins > "$RUNNER_TEMP/orthanc/plugins.json"
          python3 - "$RUNNER_TEMP/orthanc" <<'PY'
          import json, sys, pathlib
          d = pathlib.Path(sys.argv[1])
          sysinfo, plugins = json.loads((d / "system.json").read_text()), json.loads((d / "plugins.json").read_text())
          print(f"::notice title=Orthanc::versão {sysinfo.get('Version')}, API {sysinfo.get('ApiVersion')}, plugins {plugins}")
          assert plugins == [], f"plugins carregados: {plugins}"
          PY
      - name: Versão do PostgreSQL
        run: echo "::notice title=PostgreSQL::$(psql "$VYONIX_TEST_ADMIN_URL" -tAc 'SHOW server_version')"
      - name: Interface web (TypeScript estrito + empacotamento)
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Testes da plataforma
        run: python -m pytest tests_platform tests_deploy -ra -v --junitxml=platform-junit.xml
      - name: Garantia de execução (nenhum teste pulado)
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse("platform-junit.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          fails = int(s.get("failures")) + int(s.get("errors"))
          print(f"::notice title=Plataforma::testes={tests} pulados={skipped} falhas={fails}")
          assert tests > 0 and skipped == 0 and fails == 0, "testes pulados ou com falha"
          PY
      - name: CLI (init, migrate, status) em banco novo
        env:
          VYONIX_ADMIN_PASSWORD: Admin-CI-2026
        run: |
          python -m vyonix --data "$RUNNER_TEMP/vyx" init --admin-url "$VYONIX_TEST_ADMIN_URL" --db-name vyonix_cli \
            --prefix vyxcli --org clinica-ci --org-name "Clínica CI"
          python -m vyonix --data "$RUNNER_TEMP/vyx" migrate
          python -m vyonix --data "$RUNNER_TEMP/vyx" status
          ! grep -q "Admin-CI-2026" "$RUNNER_TEMP/vyx/config.json"
      - name: Testes do DICOM Print continuam isolados (sem dependência da plataforma)
        run: python -m pytest tests_platform/test_architecture.py -q
      - name: Falhas de teste como anotações
        if: failure()
        run: python tools/junit_annotations.py platform-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-test-results
          path: |
            platform-junit.xml
            e2e-shots/
          if-no-files-found: ignore
