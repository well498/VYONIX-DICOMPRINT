# Compilação, testes, empacotamento e instalador do VYONIX DICOM Print em Windows x64.
#
# Requisito mínimo do produto: Windows 10 64 bits (1809) ou Windows 11. Python 3.12 + PySide6.
# As ferramentas auxiliares (ícone, PDFs, relatório) não entram no executável.
#
# Etapas: testes (pytest, incluindo interface Qt) → PyInstaller (onedir) → Inno Setup →
# validação do .exe e do instalador (tools/ci_validate.ps1) → documentação PDF, relatório de
# validação e SHA-256 → publicação como pré-release no GitHub.
#
# Nada é publicado se qualquer etapa falhar.
name: Windows release

on:
  push:
    branches: [main, develop, "build/**", "phase/**"]
  workflow_dispatch:
    inputs:
      republish:
        description: "Substituir a release existente de RELEASE_TAG"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        id: tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Instalar dependências
        run: |
          $tools = "${{ steps.tools.outputs.python-path }}"
          "TOOLS_PY=$tools" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & $tools -m pip install -q -r requirements-tools.txt
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -c constraints-security.txt -r requirements-dev.txt
          # Pacotes já presentes na imagem do runner (ex.: filelock do pipx) não passam pela restrição acima:
          python -m pip install -q --upgrade -r constraints-security.txt
          New-Item -ItemType Directory -Force dist\validation, dist\perf | Out-Null
          "Python $(python -c 'import sys; print(sys.version.split()[0])')" | Out-File dist\validation\env.txt -Encoding utf8
          python -m pip freeze | Out-File dist\validation\env.txt -Append -Encoding utf8
          python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"

      - name: SBOM e vulnerabilidades conhecidas
        run: |
          python -m venv "$env:RUNNER_TEMP\sbomtools"
          & "$env:RUNNER_TEMP\sbomtools\Scripts\python" -m pip install -q "cyclonedx-bom>=4,<8" "pip-audit>=2.7,<3"
          $py = (Get-Command python).Source
          & "$env:RUNNER_TEMP\sbomtools\Scripts\python" tools\sbom_audit.py $py dist\sbom vyonix-dicom-print
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Compilar fontes (compileall)
        run: python -m compileall -q app packaging

      - name: Spooler do Windows e impressora "Microsoft Print to PDF"
        continue-on-error: true
        run: |
          Set-Service Spooler -StartupType Automatic; Start-Service Spooler
          $f = Get-WindowsOptionalFeature -Online -FeatureName Printing-PrintToPDFServices-Features -ErrorAction SilentlyContinue
          if ($f -and $f.State -ne "Enabled") { Enable-WindowsOptionalFeature -Online -FeatureName Printing-PrintToPDFServices-Features -NoRestart -All | Out-Null }
          Get-Printer | Format-Table Name, DriverName, PortName -AutoSize | Out-String | Tee-Object dist\validation\printers.txt

      - name: Testes automatizados
        env:
          QT_QPA_PLATFORM: offscreen
          VYONIX_REQUIRE_CODECS: "1"
        run: |
          python -m pytest tests -v -ra --junitxml=dist\validation\pytest.xml 2>&1 | Tee-Object dist\validation\pytest.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Código de saída diferente de zero com o relatório JUnit limpo (todos aprovados) indica falha no
            # encerramento do interpretador, não em teste: registrado como aviso. Qualquer falha/erro de teste reprova.
            [xml]$x = Get-Content dist\validation\pytest.xml
            $t = $x.testsuites.testsuite
            if (-not $t) { $t = $x.testsuite }
            $bad = [int]$t.failures + [int]$t.errors
            if ($bad -ne 0 -or [int]$t.tests -eq 0) { exit 1 }
            Write-Host "::warning title=pytest::Código de saída $code com $($t.tests) testes e 0 falhas/erros no JUnit (encerramento do processo)."
          }
          exit 0          # sem isto o pwsh do Actions devolve o $LASTEXITCODE do python

      - name: Versão, ícone e metadados
        id: ver
        run: |
          python tools/make_version_info.py | Tee-Object -Variable out
          $out | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          & $env:TOOLS_PY tools/make_icon.py

      - name: PyInstaller (dist\Vyonix\Vyonix.exe)
        run: |
          python -m PyInstaller --noconfirm --clean Vyonix.spec 2>&1 | Tee-Object dist\validation\pyinstaller.txt
          if (-not (Test-Path dist\Vyonix\Vyonix.exe)) { exit 1 }
          Get-ChildItem dist\Vyonix | Select-Object Name, Length
          if (Test-Path build\slim_removed.txt) { Copy-Item build\slim_removed.txt dist\perf\slim_removed.txt }
          & $env:TOOLS_PY tools/check_dll_deps.py dist\Vyonix
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: PyInstaller (dist\VYONIX_License_Manager.exe — portátil, separado do produto comercial)
        run: |
          python -m PyInstaller --noconfirm LicenseManager.spec 2>&1 | Tee-Object dist\validation\pyinstaller-lm.txt
          if (-not (Test-Path dist\VYONIX_License_Manager.exe)) { exit 1 }
          Get-Item dist\VYONIX_License_Manager.exe | Select-Object Name, Length

      - name: PyInstaller (dist\VYONIX_License_Server.exe — servidor central, separado do produto comercial)
        run: |
          python -m PyInstaller --noconfirm LicenseServer.spec 2>&1 | Tee-Object dist\validation\pyinstaller-ls.txt
          if (-not (Test-Path dist\VYONIX_License_Server.exe)) { exit 1 }
          Get-Item dist\VYONIX_License_Server.exe | Select-Object Name, Length

      - name: Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.APP_VERSION }}" "/DFileVersion=${{ steps.ver.outputs.FILE_VERSION }}" installer\Vyonix.iss 2>&1 | Tee-Object dist\validation\iscc.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.LM_VERSION }}" "/DFileVersion=${{ steps.ver.outputs.LM_FILE_VERSION }}" installer\LicenseManager.iss 2>&1 | Tee-Object dist\validation\iscc-lm.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\installer, dist\installer-lm

      - name: Validar executável e instalador
        run: |
          $inst = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          & $env:TOOLS_PY tools/bundle_vuln_check.py dist\sbom\vyonix-dicom-print.vulnerable.json dist\Vyonix
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $env:TOOLS_PY tools/scan_private_keys.py dist\Vyonix dist\installer dist\installer-lm dist\VYONIX_License_Manager.exe dist\VYONIX_License_Server.exe | Tee-Object dist\validation\private-key-scan.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\tools\ci_validate.ps1 -Installer $inst -Version "${{ steps.ver.outputs.APP_VERSION }}" -OutDir dist\validation `
            -LMExe dist\VYONIX_License_Manager.exe -LMInstaller dist\installer-lm\VYONIX_License_Manager_Setup.exe `
            -LSExe dist\VYONIX_License_Server.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Medir tamanho, memória e abertura do executável final
        run: |
          $inst = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          .\tools\ci_profile.ps1 -Label enxuta -DistDir dist\Vyonix -Installer $inst -Out dist\perf\enxuta.json
          & $env:TOOLS_PY tools/perf_annotations.py dist\perf

      - name: Pacote de entrega (PDFs, relatório, SHA-256, zip)
        run: |
          $inst = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          & $env:TOOLS_PY tools/make_release.py --perf dist\perf\enxuta.json --version "${{ steps.ver.outputs.APP_VERSION }}" --commit "${{ github.sha }}" `
            --installer $inst --junit dist\validation\pytest.xml --validation dist\validation --env dist\validation\env.txt `
            --lm-exe dist\VYONIX_License_Manager.exe --lm-installer dist\installer-lm\VYONIX_License_Manager_Setup.exe `
            --ls-exe dist\VYONIX_License_Server.exe
          git archive --format=zip --prefix="VYONIX_DICOM_Print_source_${{ steps.ver.outputs.APP_VERSION }}/" -o "dist\VYONIX_DICOM_Print_source_${{ steps.ver.outputs.APP_VERSION }}.zip" HEAD

      - name: Publicar pré-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.APP_VERSION }}"
          # RELEASE_TAG (opcional) publica uma revisão sem substituir a release anterior da mesma versão.
          $tag = if (Test-Path RELEASE_TAG) { (Get-Content RELEASE_TAG -Raw).Trim() } else { "v$v" }
          $s = Get-Content dist\release-summary.json -Raw | ConvertFrom-Json
          $notes = @"
          VYONIX DICOM Print $v — Release candidata à homologação — não liberada para uso clínico ($($s.phase)).
          Requisito mínimo: Windows 10 64 bits (1809) ou Windows 11.
          NÃO validada para uso clínico. Declaração de conformidade DICOM de homologação incluída.

          Instalador comercial: $($s.installer) — SHA-256 $($s.installer_sha256)
          (o mesmo arquivo também é publicado com o nome comercial Vyonix_Setup.exe — mesmo SHA-256)
          License Manager portátil: VYONIX_License_Manager.exe — SHA-256 $($s.lm_exe_sha256)
          License Manager (instalador opcional): VYONIX_License_Manager_Setup.exe — SHA-256 $($s.lm_installer_sha256)
          License Server (servidor central): VYONIX_License_Server.exe — SHA-256 $($s.ls_exe_sha256)
          O License Manager e o License Server são administrativos: NÃO distribuir aos clientes.
          Testes automatizados: $($s.tests.aprovado) aprovados, $($s.tests.falhou) falhas, $($s.tests.ignorado) ignorados
          Validação do executável/instalador: $($s.validation_passed) aprovadas, $($s.validation_not_verifiable) não verificáveis neste ambiente (ex.: TPM real), de $($s.validation_total)
          Commit: ${{ github.sha }}
          "@
          # Uma release publicada nunca é substituída por um push comum (os SHA-256 já entregues continuam
          # válidos). Para publicar outra revisão, altere RELEASE_TAG; para republicar a mesma de propósito,
          # execute o workflow manualmente com republish=true.
          $existing = gh release view $tag --json tagName 2>$null
          if ($existing -and "${{ github.event.inputs.republish }}" -ne "true") {
            Write-Host "::notice title=Publicação::A release $tag já existe e não foi substituída (altere RELEASE_TAG para nova revisão)."
            exit 0
          }
          # Nome comercial do instalador (Prompt Mestre §21, ADR-0011): cópia idêntica, conferida pelo SHA-256.
          Copy-Item "dist\installer\$($s.installer)" dist\installer\Vyonix_Setup.exe -Force
          $alias = (Get-FileHash dist\installer\Vyonix_Setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($alias -ne $s.installer_sha256.ToLower()) { Write-Host "::error::Vyonix_Setup.exe difere do instalador"; exit 1 }
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag --target "${{ github.sha }}" --prerelease --title "VYONIX DICOM Print $tag (candidata à homologação)" --notes $notes `
            "dist\installer\$($s.installer)" dist\installer\Vyonix_Setup.exe dist\VYONIX_License_Manager.exe dist\installer-lm\VYONIX_License_Manager_Setup.exe `
            dist\VYONIX_License_Server.exe "dist\$($s.zip)" "dist\$($s.lm_zip)" "dist\$($s.ls_zip)" `
            "dist\VYONIX_DICOM_Print_source_$v.zip" `
            dist\release-summary.json dist\validation\results.json dist\validation\pytest.xml `
            dist\sbom\vyonix-dicom-print.cdx.json dist\sbom\vyonix-dicom-print.audit.json

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          function Note($title, $file, $n) {
            if (Test-Path $file) {
              $t = (Get-Content $file -Tail $n) -join "`n"
              $t = $t.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
              if ($t.Length -gt 3500) { $t = $t.Substring($t.Length - 3500) }
              Write-Host "::error title=$title::$t"
            }
          }
          Note "pytest" dist\validation\pytest.txt 80
          Note "pyinstaller" dist\validation\pyinstaller.txt 40
          Note "iscc" dist\validation\iscc.txt 40
          Get-ChildItem dist\validation\smoke-*.json -ErrorAction SilentlyContinue | ForEach-Object { Note "smoke $($_.Name)" $_.FullName 60 }
          Note "validação" dist\validation\results.json 120
          Get-ChildItem dist\validation\work -Recurse -Filter *.log -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { Note "log $($_.Name)" $_.FullName 40 }

      - name: Guardar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyonix-windows-build
          path: |
            dist/installer
            dist/installer-lm
            dist/VYONIX_License_Manager.exe
            dist/VYONIX_License_Server.exe
            dist/validation
            dist/sbom
            dist/*.zip
            dist/release-summary.json
            dist/perf
          if-no-files-found: ignore
