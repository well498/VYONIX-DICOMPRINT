[project]
name = "vyonix-dicom-print"
version = "1.0.0.dev4"
description = "VYONIX DICOM Print — Precisão em cada imagem."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietário" }
dependencies = [
    "PySide6>=6.7,<7",
    "pydicom>=3.0,<4",
    "pynetdicom>=3.0,<4",
    "numpy>=2,<3",
    "Pillow>=11",
    "pylibjpeg>=2.0",
    "pylibjpeg-openjpeg>=2.3",
    "pyjpegls>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.10"]

[project.gui-scripts]
vyonix = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
